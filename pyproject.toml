[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-evidence-recheck"
version = "1.0.0"
description = "Re-run an open upstream PR's speedup claim on the PR's own git tree and emit a KEEP/RETRACT certificate"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "linluozi" }]
keywords = ["benchmark", "reproducibility", "pull-request", "performance"]
dependencies = []

[project.scripts]
prrecheck = "prrecheck.cli:main"

[tool.setuptools]
packages = ["prrecheck"]
